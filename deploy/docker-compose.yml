# Celva API — production stack (one project among others on the shared VPS).
# Routing/TLS is handled by the shared Traefik proxy on the external `web`
# network (lives in the gabee repo's deploy/proxy/ — already running on the
# VPS). This stack only adds the API + its Postgres.
#
# This one file runs as two isolated projects on the same VPS (gabee §11):
#   prod:    docker compose -p celva          --env-file deploy/.env.production up -d
#   preprod: docker compose -p celva-preprod  --env-file deploy/.env.preprod    up -d
# Compose prefixes volumes/networks with the project name, so the two stacks'
# databases and internal networks never collide; only the Traefik router name is
# global, so it's parameterized via ${TRAEFIK_ROUTER}.
#
# Images are normally pulled from GHCR (built in CI). The `build:` blocks are a
# fallback so the same file can build locally with `--build`.

services:
  # ── PostgreSQL (private network only) ───────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - celva-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  # ── One-shot: apply Prisma migrations, then exit ────────────────────────────
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ${REGISTRY:-ghcr.io/iamvaln}/celva-api:${IMAGE_TAG:-latest}
    env_file: .env.production
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # ── NestJS API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ${REGISTRY:-ghcr.io/iamvaln}/celva-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    # Migrations are handled by the `migrate` one-shot above, so the API just
    # boots (bypasses the image's migrate-then-boot entrypoint).
    command: ['node', 'dist/src/main.js']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal, web]
    healthcheck:
      # /health is version-neutral and excluded from the global `api` prefix; it
      # pings the DB. node:20-alpine has no curl/wget, so use the http module —
      # anything < 500 is healthy, network errors are fatal.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.${TRAEFIK_ROUTER:-celva-api}.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.${TRAEFIK_ROUTER:-celva-api}.entrypoints=websecure
      - traefik.http.routers.${TRAEFIK_ROUTER:-celva-api}.tls.certresolver=le
      - traefik.http.services.${TRAEFIK_ROUTER:-celva-api}.loadbalancer.server.port=3001

volumes:
  celva-db:

networks:
  internal: # private: db ↔ api/migrate only
  web: # shared Traefik proxy network (already created on the VPS)
    external: true
