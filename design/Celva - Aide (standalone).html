document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 --beige:             #E8D9C6;\n  --beige-light:       #F0E8DA;\n  --beige-dark:        #D4C4AE;\n  --olive:             #595D40;\n  --olive-light:       #6E7354;\n  --olive-dark:        #3F422D;\n  --cream:             #FAF7F2;\n  --dark:              #1A1A18;\n  --dark-surface:      #262622;\n  --dark-border:       #3A3A35;\n  --gray:              #8C8680;\n  --gray-light:        #B5B0A9;\n  --gray-dark:         #5C5955;\n\n  /* Semantic tokens (light mode) */\n  --bg:           var(--cream);\n  --bg-alt:       var(--beige);\n  --surface:      var(--beige);\n  --fg:           var(--olive);\n  --fg-muted:     var(--gray);\n  --fg-inverse:   var(--cream);\n  --border:       var(--beige-dark);\n  --accent:       var(--terracotta);\n  --accent-hover: var(--terracotta-dark);\n\n  /* Typography */\n  --font-display: \"Bodoni Moda\", \"Didot\", \"Times New Roman\", serif;\n  --font-body:    \"Cormorant Garamond\", \"Garamond\", Georgia, serif;\n\n  /* Spacing */\n  --gutter-mobile:   24px;\n  --gutter-tablet:   48px;\n  --gutter-desktop:  96px;\n  --section-gap:     112px;\n\n  /* Pattern */\n  --pattern-opacity: 0.04;\n\n  /* Grid */\n  --grid-cols: 4;\n\n  /* Misc */\n  --max-content: 1440px;\n  --transition: 200ms ease;\n}\n\n[data-theme=\"dark\"] {\n  --bg:         var(--dark);\n  --bg-alt:     var(--dark-surface);\n  --surface:    var(--dark-surface);\n  --fg:         var(--cream);\n  --fg-muted:   var(--gray-light);\n  --fg-inverse: var(--cream);\n  --border:     var(--dark-border);\n  --accent:     var(--terracotta);\n  --accent-hover: var(--terracotta-light);\n}\n\n/* ---------- Base ---------- */\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\nhtml { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }\n\nbody {\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: 16px;\n  line-height: 1.55;\n  color: var(--fg);\n  background: var(--bg);\n  transition: background-color 240ms ease, color 240ms ease;\n  min-height: 100vh;\n}\n\nimg, svg { display: block; max-width: 100%; }\nsvg { flex-shrink: 0; }\n\na {\n  color: inherit;\n  text-decoration: none;\n  transition: color var(--transition);\n}\na:hover { color: var(--accent); }\n\nbutton { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }\n\n/* ---------- Typography ---------- */\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  color: var(--fg);\n  margin: 0;\n  letter-spacing: -0.005em;\n  text-wrap: balance;\n}\n.h-display { font-size: clamp(56px, 7vw, 104px); font-weight: 400; line-height: 0.98; letter-spacing: -0.01em; }\n.h1        { font-size: clamp(40px, 4.2vw, 64px); line-height: 1.05; font-weight: 700; }\n.h2        { font-size: clamp(32px, 3vw, 44px);   line-height: 1.1; }\n.h3        { font-size: clamp(22px, 1.6vw, 26px); line-height: 1.2; }\n.eyebrow {\n  font-family: var(--font-body);\n  font-weight: 500;\n  font-size: 12px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--fg-muted);\n}\n.lead { font-size: 19px; line-height: 1.55; color: var(--fg); max-width: 56ch; }\nem, .italic { font-style: italic; }\n\n/* ---------- Layout ---------- */\n.container {\n  width: 100%;\n  max-width: var(--max-content);\n  margin: 0 auto;\n  padding: 0 var(--gutter-mobile);\n}\n@media (min-width: 720px)  { .container { padding: 0 var(--gutter-tablet); } }\n@media (min-width: 1080px) { .container { padding: 0 var(--gutter-desktop); } }\n\n.section { padding-block: var(--section-gap); }\n.section--tight { padding-block: 72px; }\n.section--alt { background: var(--bg-alt); }\n\n/* ---------- Pattern background ---------- */\n.has-pattern {\n  position: relative;\n  isolation: isolate;\n}\n.has-pattern::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background-image: url(\"cd487dfe-4789-4e0f-ba4e-b9baac852a45\");\n  background-size: 160px 160px;\n  opacity: var(--pattern-opacity);\n  pointer-events: none;\n  z-index: -1;\n}\n\n/* ---------- Buttons ---------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 10px;\n  padding: 16px 32px;\n  font-family: var(--font-body);\n  font-weight: 500;\n  font-size: 13px;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  border: 1px solid transparent;\n  border-radius: 0;\n  cursor: pointer;\n  transition: all 220ms ease;\n  text-decoration: none;\n  white-space: nowrap;\n}\n.btn--primary {\n  background: var(--accent);\n  color: var(--cream);\n}\n.btn--primary:hover {\n  background: var(--accent-hover);\n  color: var(--cream);\n}\n.btn--secondary {\n  background: transparent;\n  color: var(--fg);\n  border-color: var(--fg);\n}\n.btn--secondary:hover {\n  background: var(--fg);\n  color: var(--bg);\n}\n.btn--ghost {\n  background: transparent;\n  color: var(--fg);\n  padding: 8px 0;\n  letter-spacing: 0.16em;\n  border-bottom: 1px solid var(--fg);\n}\n.btn--ghost:hover { color: var(--accent); border-color: var(--accent); }\n.btn--block { width: 100%; }\n\n/* ---------- Header / Nav ---------- */\n.announce {\n  background: var(--olive);\n  color: var(--cream);\n  font-size: 12px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  text-align: center;\n  padding: 10px 16px;\n}\n.header {\n  position: sticky;\n  top: 0;\n  z-index: 50;\n  background: var(--bg);\n  border-bottom: 1px solid var(--border);\n  transition: background-color 240ms ease;\n}\n.nav {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  gap: 24px;\n  padding: 22px 0;\n}\n.nav__brand {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  color: var(--accent);\n  font-family: var(--font-display);\n  font-size: 22px;\n  letter-spacing: 0.16em;\n  font-weight: 500;\n}\n.nav__brand svg { width: 34px; height: 34px; }\n.nav__brand:hover { color: var(--accent-hover); }\n.nav__links {\n  display: flex;\n  gap: 36px;\n  list-style: none;\n  margin: 0;\n  padding: 0;\n  justify-self: center;\n}\n.nav__links a {\n  font-family: var(--font-body);\n  font-weight: 500;\n  font-size: 13px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--fg);\n}\n.nav__links a.is-active { color: var(--accent); }\n.nav__actions {\n  display: flex;\n  align-items: center;\n  gap: 18px;\n  justify-self: end;\n}\n.icon-btn {\n  width: 38px; height: 38px;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  position: relative;\n  color: var(--fg);\n  transition: color var(--transition);\n}\n.icon-btn:hover { color: var(--accent); }\n.icon-btn svg { width: 20px; height: 20px; }\n.cart-badge {\n  position: absolute;\n  top: 4px; right: 2px;\n  min-width: 16px;\n  height: 16px;\n  background: var(--accent);\n  color: var(--cream);\n  font-family: var(--font-body);\n  font-size: 10px;\n  font-weight: 600;\n  border-radius: 999px;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  padding: 0 4px;\n  line-height: 1;\n}\n\n/* ---------- Image placeholder ---------- */\n.ph {\n  position: relative;\n  background: var(--beige);\n  overflow: hidden;\n  isolation: isolate;\n}\n[data-theme=\"dark\"] .ph { background: var(--dark-surface); }\n.ph::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background-image:\n    repeating-linear-gradient(\n      135deg,\n      transparent 0,\n      transparent 18px,\n      rgba(89, 93, 64, 0.04) 18px,\n      rgba(89, 93, 64, 0.04) 19px\n    );\n  z-index: 0;\n}\n[data-theme=\"dark\"] .ph::before {\n  background-image:\n    repeating-linear-gradient(\n      135deg,\n      transparent 0,\n      transparent 18px,\n      rgba(250, 247, 242, 0.04) 18px,\n      rgba(250, 247, 242, 0.04) 19px\n    );\n}\n.ph__label {\n  position: absolute;\n  bottom: 12px; left: 12px;\n  z-index: 1;\n  font-family: \"JetBrains Mono\", \"SF Mono\", \"Menlo\", monospace;\n  font-size: 10px;\n  letter-spacing: 0.04em;\n  color: var(--olive);\n  background: rgba(250, 247, 242, 0.72);\n  padding: 4px 8px;\n  border-radius: 1px;\n  text-transform: lowercase;\n}\n[data-theme=\"dark\"] .ph__label {\n  color: var(--cream);\n  background: rgba(26, 26, 24, 0.7);\n}\n.ph[data-ratio=\"3/4\"]  { aspect-ratio: 3/4; }\n.ph[data-ratio=\"4/5\"]  { aspect-ratio: 4/5; }\n.ph[data-ratio=\"1/1\"]  { aspect-ratio: 1/1; }\n.ph[data-ratio=\"16/9\"] { aspect-ratio: 16/9; }\n.ph[data-ratio=\"21/9\"] { aspect-ratio: 21/9; }\n\n/* Inline monogram inside ph for extra texture */\n.ph__mono {\n  position: absolute;\n  inset: 0;\n  display: grid;\n  place-items: center;\n  color: var(--olive);\n  opacity: 0.08;\n  z-index: 0;\n}\n.ph__mono svg { width: 32%; height: auto; }\n[data-theme=\"dark\"] .ph__mono { color: var(--cream); }\n\n/* ---------- Product card ---------- */\n.product-card { display: block; color: inherit; }\n.product-card__media {\n  margin-bottom: 16px;\n  overflow: hidden;\n  position: relative;\n}\n.product-card__media .ph { transition: transform 600ms ease; }\n.product-card:hover .ph { transform: scale(1.02); }\n.product-card__badge {\n  position: absolute;\n  top: 12px; left: 12px;\n  background: var(--accent);\n  color: var(--cream);\n  font-family: var(--font-body);\n  font-size: 10px;\n  font-weight: 600;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  padding: 5px 9px;\n  z-index: 2;\n}\n.product-card__name {\n  font-family: var(--font-display);\n  font-size: 18px;\n  font-weight: 400;\n  margin: 0 0 4px;\n  line-height: 1.2;\n}\n.product-card__meta {\n  font-size: 13px;\n  color: var(--fg-muted);\n  font-style: italic;\n  margin: 0 0 8px;\n}\n.product-card__price {\n  font-family: var(--font-display);\n  font-size: 16px;\n  color: var(--accent);\n}\n.product-card__price del {\n  color: var(--gray);\n  text-decoration: line-through;\n  font-size: 14px;\n  margin-right: 8px;\n}\n\n/* ---------- Product grid ---------- */\n.product-grid {\n  display: grid;\n  grid-template-columns: repeat(var(--grid-cols), 1fr);\n  gap: 40px 28px;\n}\n );\n}\n.tweak__pill:hover:not(.is-active) { border-color: var(--accent); color: var(--accent); }\n.tweaks__close {\n  width: 28px; height: 28px;\n  display: grid; place-items: center;\n  color: var(--fg-muted);\n}\n.tweaks__close:hover { color: var(--accent); }\n\n/* ---------- Burger (mobile menu trigger) ---------- */\n.burger { display: none; }\n@media (max-width: 880px) {\n  .burger { display: inline-flex; }\n  .nav__links { display: none; }\n  .nav { grid-template-columns: auto 1fr auto; }\n  .nav__brand { justify-self: start; }\n  .nav__actions { gap: 10px; }\n}\n\n/* ---------- Overlay backdrop ---------- */\n.overlay {\n  position: fixed;\n  inset: 0;\n  background: rgba(26, 26, 24, 0.42);\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity 240ms ease;\n  z-index: 70;\n}\n.overlay.is-open {\n  opacity: 1;\n  pointer-events: auto;\n}\n\n/* ---------- Mini-cart drawer ---------- */\n.drawer {\n  position: fixed;\n  top: 0; right: 0;\n  height: 100vh;\n  width: min(420px, 100%);\n  background: var(--bg);\n  z-index: 80;\n  transform: translateX(100%);\n  transition: transform 320ms cubic-bezier(0.4, 0, 0.2, 1);\n  display: flex;\n  flex-direction: column;\n  border-left: 1px solid var(--border);\n}\n.drawer.is-open { transform: translateX(0); }\n.drawer__head {\n  padding: 22px 28px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  border-bottom: 1px solid var(--border);\n}\n.drawer__head h3 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: 20px;\n  margin: 0;\n}\n.drawer__head .count {\n  font-family: var(--font-body);\n  font-style: italic;\n  font-size: 13px;\n  color: var(--fg-muted);\n  margin-left: 8px;\n}\n.drawer__close {\n  width: 36px; height: 36px;\n  display: grid;\n  place-items: center;\n  color: var(--fg);\n}\n.drawer__close:hover { color: var(--accent); }\n.drawer__body {\n  flex: 1;\n  overflow-y: auto;\n  padding: 8px 28px 24px;\n}\n.drawer__line {\n  display: grid;\n  grid-temp column;\n  border-right: 1px solid var(--border);\n}\n.mobile-menu.is-open { transform: translateX(0); }\n.mobile-menu__head {\n  padding: 22px 28px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  border-bottom: 1px solid var(--border);\n}\n.mobile-menu__brand { color: var(--accent); font-family: var(--font-display); font-size: 18px; letter-spacing: 0.18em; }\n.mobile-menu__body {\n  flex: 1;\n  padding: 12px 28px 28px;\n  overflow-y: auto;\n}\n.mobile-menu__body ul { list-style: none; padding: 0; margin: 0; }\n.mobile-menu__body a {\n  display: block;\n  padding: 18px 0;\n  font-family: var(--font-display);\n  font-size: 22px;\n  color: var(--fg);\n  border-bottom: 1px solid var(--border);\n}\n.mobile-menu__body a:hover { color: var(--accent); }\n.mobile-menu__sub {\n  margin-top: 22px;\n  padding-top: 22px;\n  border-top: 1px solid var(--border);\n}\n.mobile-menu__sub ul { display: flex; flex-direction: column; gap: 10px; }\n.mobile-menu__sub a {\n  padding: 4px 0;\n  font-family: var(--font-body);\n  font-size: 14px;\n  border-bottom: none;\n  color: var(--fg-muted);\n}\n.mobile-menu__foot {\n  padding: 18px 28px 24px;\n  background: var(--bg-alt);\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  font-size: 12px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--fg-muted);\n}\n[data-theme=\"dark\"] .mobile-menu__foot { background: var(--dark-surface); }\n\n/* ---------- Toast notifications ---------- */\n.toast-stack {\n  position: fixed;\n  top: 24px;\n  left: 50%;\n  transform: translateX(-50%);\n  z-index: 90;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n  pointer-events: none;\n}\n.toast {\n  background: var(--olive);\n  color: var(--cream);\n  padding: 14px 22px;\n  display: inline-flex;\n  align-items: center;\n  gap: 14px;\n  font-family: var(--font-body);\n  font-size: 14px;\n  border: 1px solid rgba(250,247,242,0.18);\n  pointer-events: auto;\n  animation: toastSlide 320ms cubic-bezier(0.4,0,0.2,1);\n  max-width: 480px;\n}\n[data-theme=\"dark\"] .toast { background: var(--cream); color: var(--dark); border-color: rgba(0,0,0,0.1); }\n.toast svg { width: 16px; height: 16px; color: var(--terracotta-light); flex-shrink: 0; }\n[data-theme=\"dark\"] .toast svg { color: var(--accent); }\n.toast strong { font-family: var(--font-display); font-weight: 400; font-size: 15px; }\n.toast.is-dismissing { animation: toastOut 240ms ease forwards; }\n@keyframes toastSlide {\n  from { opacity: 0; transform: translateY(-8px); }\n  to   { opacity: 1; transform: translateY(0); }\n}\n@keyframes toastOut {\n  to { opacity: 0; transform: translateY(-8px); }\n}\n\n/* ---------- Cookie banner ---------- */\n.cookies {\n  position: fixed;\n  bottom: 96px;\n  left: 24px;\n  width: min(380px, calc(100% - 48px));\n  background: var(--bg);\n  border: 1px solid var(--border);\n  padding: 22px 24px 20px;\n  z-index: 55;\n  box-shadow: 0 24px 50px rgba(0,0,0,0.16);\n  transform: translateY(16px);\n  opacity: 0;\n  transition: opacity 320ms ease, transform 320ms ease;\n}\n.cookies.is-visible { opacity: 1; transform: translateY(0); }\n.cookies p { margin: 0 0 16px; font-size: 14px; line-height: 1.55; color: var(--fg); }\n.cookies p strong { font-family: var(--font-display); font-weight: 400; display: block; font-size: 15px; margin-bottom: 4px; }\n.cookies__actions { display: flex; gap: 8px; }\n.cookies__actions .btn {\n  padding: 10px 16px;\n  font-size: 10px;\n  flex: 1;\n}\n\n/* ---------- Utilities ---------- */\n.divider { width: 100%; height: 1px; background: var(--border); }\n.text-center { text-align: center; }\n.muted { color: var(--fg-muted); }\n.accent { color: var(--accent); }\n.flow > * + * { margin-top: 1em; }\n\n.fade-up {\n  opacity: 0;\n  transform: translateY(8px);\n  transition: opacity 600ms ease, transform 600ms ease;\n}\n.fade-up.in {\n  opacity: 1;\n  transform: none;\n}\n<\u002Fstyle>\n  \n<\u002Fhead>\n<body data-screen-label=\"11 Aide\">\n\n  <div data-celva=\"svg-defs\"><\u002Fdiv>\n  <div data-celva=\"announce\"><\u002Fdiv>\n  <div data-celva=\"header\"><\u002Fdiv>\n\n  <!-- Head -->\n  <section class=\"aide-head\">\n    <div class=\"container\">\n      <p class=\"eyebrow\">Service client · Atelier Celva<\u002Fp>\n      <h1 class=\"h1\">Comment <em>peut-on aider&nbsp;?<\u002Fem><\u002Fh1>\n      <p class=\"lead\">Tailles, livraison, retours, entretien — et les réponses aux questions qu'on nous pose le plus.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Tabs -->\n  <nav class=\"aide-tabs\">\n    <div class=\"container aide-tabs__row\" role=\"tablist\">\n      <button class=\"aide-tab is-active\" data-tab=\"sizes\" role=\"tab\">Guide des tailles<\u002Fbutton>\n      <button class=\"aide-tab\" data-tab=\"shipping\" role=\"tab\">Livraison<\u002Fbutton>\n      <button class=\"aide-tab\" data-tab=\"returns\" role=\"tab\">Retours &amp; échanges<\u002Fbutton>\n      <button class=\"aide-tab\" data-tab=\"care\" role=\"tab\">Entretien des pièces<\u002Fbutton>\n      <button class=\"aide-tab\" data-tab=\"faq\" role=\"tab\">Questions fréquentes<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- Sizes -->\n  <section class=\"section section--tight aide-panel is-active\" id=\"panel-sizes\">\n    <div class=\"container aide-grid\">\n      <aside class=\"aide-aside\">\n        <h2 class=\"h3\">Comment mesurer&nbsp;?<\u002Fh2>\n        <p>Mesurez-vous en sous-vêtements, avec un mètre de couturière souple, à plat contre le corps sans serrer. Si vous hésitez entre deux tailles, prenez la plus grande — nos coupes sont volontairement amples.<\u002Fp>\n        <p><em>Encore un doute&nbsp;?<\u002Fem> Écrivez-nous sur WhatsApp avec deux photos (de face, de profil) et nous vous conseillons en moins d'une heure.<\u002Fp>\n        <a href=\"#\" class=\"btn btn--secondary\">Discuter sur WhatsApp<\u002Fa>\n      <\u002Faside>\n\n      <div class=\"aide-main\">\n        <h3 class=\"h3 aide-section-title\">Femmes · Hauts &amp; robes<\u002Fh3>\n        <div class=\"size-table\">\n          <table>\n            <thead>\n              <tr><th>Taille<\u002Fth><th>FR<\u002Fth><th>Buste<\u002Fth><th>Taille<\u002Fth><th>Hanches<\u002Fth><\u002Ftr>\n            <\u002Fthead>\n            <tbody>\n              <tr><td>XS<\u002Ftd><td>34<\u002Ftd><td>82 cm<\u002Ftd><td>62 cm<\u002Ftd><td>88 cm<\u002Ftd><\u002Ftr>\n              <tr><td>S<\u002Ftd><td>36<\u002Ftd><td>86 cm<\u002Ftd><td>66 cm<\u002Ftd><td>92 cm<\u002Ftd><\u002Ftr>\n              <tr><td>M<\u002Ftd><td>38<\u002Ftd><td>90 cm<\u002Ftd><td>70 cm<\u002Ftd><td>96 cm<\u002Ftd><\u002Ftr>\n              <tr><td>L<\u002Ftd><td>40<\u002Ftd><td>94 cm<\u002Ftd><td>74 cm<\u002Ftd><td>100 cm<\u002Ftd><\u002Ftr>\n              <tr><td>XL<\u002Ftd><td>42<\u002Ftd><td>98 cm<\u002Ftd><td>78 cm<\u002Ftd><td>104 cm<\u002Ftd><\u002Ftr>\n              <tr><td>XXL<\u002Ftd><td>44<\u002Ftd><td>102 cm<\u002Ftd><td>82 cm<\u002Ftd><td>108 cm<\u002Ftd><\u002Ftr>\n              <tr><td>3XL<\u002Ftd><td>46<\u002Ftd><td>106 cm<\u002Ftd><td>86 cm<\u002Ftd><td>112 cm<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n\n        <h3 class=\"h3 aide-section-title\">Femmes · Pantalons &amp; jupes<\u002Fh3>\n        <div class=\"size-table\">\n          <table>\n            <thead>\n              <tr><th>Taille<\u002Fth><th>FR<\u002Fth><th>Taille<\u002Fth><th>Hanches<\u002Fth><th>Entrejambe<\u002Fth><\u002Ftr>\n            <\u002Fthead>\n            <tbody>\n              <tr><td>XS<\u002Ftd><td>34<\u002Ftd><td>62 cm<\u002Ftd><td>88 cm<\u002Ftd><td>78 cm<\u002Ftd><\u002Ftr>\n              <tr><td>S<\u002Ftd><td>36<\u002Ftd><td>66 cm<\u002Ftd><td>92 cm<\u002Ftd><td>78 cm<\u002Ftd><\u002Ftr>\n              <tr><td>M<\u002Ftd><td>38<\u002Ftd><td>70 cm<\u002Ftd><td>96 cm<\u002Ftd><td>80 cm<\u002Ftd><\u002Ftr>\n              <tr><td>L<\u002Ftd><td>40<\u002Ftd><td>74 cm<\u002Ftd><td>100 cm<\u002Ftd><td>80 cm<\u002Ftd><\u002Ftr>\n              <tr><td>XL<\u002Ftd><td>42<\u002Ftd><td>78 cm<\u002Ftd><td>104 cm<\u002Ftd><td>82 cm<\u002Ftd><\u002Ftr>\n              <tr><td>XXL<\u002Ftd><td>44<\u002Ftd><td>82 cm<\u002Ftd><td>108 cm<\u002Ftd><td>82 cm<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n\n        <h3 class=\"h3 aide-section-title\">Hommes · Hauts<\u002Fh3>\n        <div class=\"size-table\">\n          <table>\n            <thead>\n              <tr><th>Taille<\u002Fth><th>Poitrine<\u002Fth><th>Taille<\u002Fth><th>Cou<\u002Fth><\u002Ftr>\n            <\u002Fthead>\n            <tbody>\n              <tr><td>S<\u002Ftd><td>92 cm<\u002Ftd><td>76 cm<\u002Ftd><td>38 cm<\u002Ftd><\u002Ftr>\n              <tr><td>M<\u002Ftd><td>98 cm<\u002Ftd><td>82 cm<\u002Ftd><td>40 cm<\u002Ftd><\u002Ftr>\n              <tr><td>L<\u002Ftd><td>104 cm<\u002Ftd><td>88 cm<\u002Ftd><td>42 cm<\u002Ftd><\u002Ftr>\n              <tr><td>XL<\u002Ftd><td>110 cm<\u002Ftd><td>94 cm<\u002Ftd><td>44 cm<\u002Ftd><\u002Ftr>\n              <tr><td>XXL<\u002Ftd><td>116 cm<\u002Ftd><td>100 cm<\u002Ftd><td>46 cm<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n\n        <div class=\"aide-note\">\n          <span class=\"aide-note__num\">↺<\u002Fspan>\n          <p><strong>Sur-mesure&nbsp;?<\u002Fstrong> Toutes nos pièces peuvent être ajustées en atelier. Le sur-mesure complet ajoute 15–25 % au prix et 4 à 6 semaines au délai. <a href=\"index.html#sur-mesure\" class=\"aide-note__link\">Le studio sur-mesure<\u002Fa><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Shipping -->\n  <section class=\"section section--tight aide-panel\" id=\"panel-shipping\">\n    <div class=\"container aide-grid\">\n      <aside class=\"aide-aside\">\n        <h2 class=\"h3\">Délais &amp; tarifs<\u002Fh2>\n        <p>Tous nos envois partent de l'atelier rue Foch à Douala. Vous recevez un numéro de suivi par WhatsApp dès l'expédition.<\u002Fp>\n        <p><em>Une urgence&nbsp;?<\u002Fem> Le retrait à l'atelier est ouvert du mardi au samedi, 10 h – 19 h. La pièce vous est mise de côté pendant 7 jours.<\u002Fp>\n      <\u002Faside>\n\n      <div class=\"aide-main\">\n        <div class=\"ship-list\">\n          <article class=\"ship-card\">\n            <div class=\"ship-card__zone\">\n              <span class=\"eyebrow\">Zone<\u002Fspan>\n              <h3>Douala &amp; Yaoundé<\u002Fh3>\n            <\u002Fdiv>\n            <div class=\"ship-card__detail\">\n              <p><strong>Express · 24 h ouvrées<\u002Fstrong><\u002Fp>\n              <p class=\"muted\">Coursier à moto, notifié par WhatsApp<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"ship-card__price\">\n              <p class=\"accent\">Offert<\u002Fp>\n              <p class=\"muted\">dès 50 000 FCFA<\u002Fp>\n            <\u002Fdiv>\n          <\u002Farticle>\n          <article class=\"ship-card\">\n            <div class=\"ship-card__zone\">\n              <span class=\"eyebrow\">Zone<\u002Fspan>\n              <h3>Province · Cameroun<\u002Fh3>\n            <\u002Fdiv>\n            <div class=\"ship-card__detail\">\n              <p><strong>Standard · 5 à 8 jours<\u002Fstrong><\u002Fp>\n              <p class=\"muted\">Bafoussam, Limbé, Garoua, Maroua, Ngaoundéré<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"ship-card__price\">\n              <p>2 500 FCFA<\u002Fp>\n              <p class=\"muted\">offert dès 80 000 FCFA<\u002Fp>\n            <\u002Fdiv>\n          <\u002Farticle>\n          <article class=\"ship-card\">\n            <div class=\"ship-card__zone\">\n              <span class=\"eyebrow\">Zone<\u002Fspan>\n              <h3>Afrique de l'Ouest<\u002Fh3>\n            <\u002Fdiv>\n            <div class=\"ship-card__detail\">\n              <p><strong>DHL · 7 à 10 jours<\u002Fstrong><\u002Fp>\n              <p class=\"muted\">Sénégal, Côte d'Ivoire, Mali, Bénin, Togo, Burkina, Gabon<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"ship-card__price\">\n              <p>18 000 FCFA<\u002Fp>\n              <p class=\"muted\">à partir de<\u002Fp>\n            <\u002Fdiv>\n          <\u002Farticle>\n          <article class=\"ship-card\">\n            <div class=\"ship-card__zone\">\n              <span class=\"eyebrow\">Zone<\u002Fspan>\n              <h3>Europe &amp; reste du monde<\u002Fh3>\n            <\u002Fdiv>\n            <div class=\"ship-card__detail\">\n              <p><strong>DHL Express · 10 à 14 jours<\u002Fstrong><\u002Fp>\n              <p class=\"muted\">Hors taxes locales<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"ship-card__price\">\n              <p>34 000 FCFA<\u002Fp>\n              <p class=\"muted\">à partir de<\u002Fp>\n            <\u002Fdiv>\n          <\u002Farticle>\n          <article class=\"ship-card\">\n            <div class=\"ship-card__zone\">\n              <span class=\"eyebrow\">Zone<\u002Fspan>\n              <h3>Retrait à l'atelier<\u002Fh3>\n            <\u002Fdiv>\n            <div class=\"ship-card__detail\">\n              <p><strong>Rue Foch, Douala<\u002Fstrong><\u002Fp>\n              <p class=\"muted\">Mardi au samedi · 10 h – 19 h<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"ship-card__price\">\n              <p class=\"accent\">Gratuit<\u002Fp>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fdiv>\n\n        <div class=\"aide-note\">\n          <span class=\"aide-note__num\">⌛<\u002Fspan>\n          <p><strong>Préparation à l'atelier&nbsp;:<\u002Fstrong> 1 à 2 jours ouvrés pour les pièces du catalogue, 4 à 6 semaines pour les pièces sur-mesure. Vous êtes informée à chaque étape.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Returns -->\n  <section class=\"section section--tight aide-panel\" id=\"panel-returns\">\n    <div class=\"container aide-grid\">\n      <aside class=\"aide-aside\">\n        <h2 class=\"h3\">Notre engagement<\u002Fh2>\n        <p>Une pièce qui ne tombe pas n'est pas une bonne pièce. Vous avez 14 jours pour nous la renvoyer, dans son emballage d'origine, non portée et étiquettes en place.<\u002Fp>\n        <p><em>Un défaut&nbsp;?<\u002Fem> Une couture, un fil, un bouton — écrivez-nous. Nous réparons à vie les pièces que nous fabriquons.<\u002Fp>\n      <\u002Faside>\n\n      <div class=\"aide-main\">\n        <ol class=\"aide-steps\">\n          <li>\n            <span class=\"aide-steps__num\">01<\u002Fspan>\n            <div>\n              <h3>Écrivez-nous<\u002Fh3>\n              <p>Par email ou WhatsApp avec votre numéro de commande, dans les 14 jours suivant la réception. Une réponse sous 24 h.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li>\n            <span class=\"aide-steps__num\">02<\u002Fspan>\n            <div>\n              <h3>Emballez la pièce<\u002Fh3>\n              <p>Dans son calicot d'origine, étiquettes intactes, non portée. Nous fournissons le bon de retour à imprimer.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li>\n            <span class=\"aide-steps__num\">03<\u002Fspan>\n            <div>\n              <h3>Coursier ou dépôt<\u002Fh3>\n              <p>À Douala et Yaoundé, un coursier passe le chercher (gratuit). Ailleurs, dépôt en agence DHL — frais à votre charge sur les renvois standard.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li>\n            <span class=\"aide-steps__num\">04<\u002Fspan>\n            <div>\n              <h3>Remboursement sous 5 jours<\u002Fh3>\n              <p>Une fois la pièce reçue et inspectée, nous remboursons par le même moyen de paiement. Sous 5 jours ouvrés.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fli>\n        <\u002Fol>\n\n        <div class=\"aide-note\">\n          <span class=\"aide-note__num\">∞<\u002Fspan>\n          <p><strong>Réparation à vie.<\u002Fstrong> Ourlet décousu trois ans plus tard, bouton perdu, doublure abîmée — repassez à l'atelier ou envoyez-nous. C'est inclus, et c'est notre signature.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Care -->\n  <section class=\"section section--tight aide-panel\" id=\"panel-care\">\n    <div class=\"container aide-grid\">\n      <aside class=\"aide-aside\">\n        <h2 class=\"h3\">Soigner ses pièces<\u002Fh2>\n        <p>Toutes nos pièces ont une étiquette d'entretien cousue à l'intérieur. Lisez-la avant tout, en particulier pour les soies et les cotons cirés.<\u002Fp>\n      <\u002Faside>\n\n      <div class=\"aide-main\">\n        <div class=\"care-grid\">\n          <div class=\"care-card\">\n            <span class=\"eyebrow\">Coton<\u002Fspan>\n            <h3>Lavage 30°, doux<\u002Fh3>\n            <p>Toujours à l'envers, dans un filet pour les pièces brodées. Pas de javel. Séchage à plat à l'ombre. Le coton brut se patine — c'est voulu.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"care-card\">\n            <span class=\"eyebrow\">Coton ciré<\u002Fspan>\n            <h3>Brosse douce, jamais d'eau chaude<\u002Fh3>\n            <p>Une brosse à habit suffit pour 95 % des taches. À réenduire à la cire d'abeille tous les 18 mois — service offert à l'atelier.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"care-card\">\n            <span class=\"eyebrow\">Lin<\u002Fspan>\n            <h3>Lavage 30°, sans adoucissant<\u002Fh3>\n            <p>Le lin aime être lavé. Plus il vieillit, plus il devient doux. Repassage à la vapeur, sur l'envers. Le froissé n'est pas un défaut.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"care-card\">\n            <span class=\"eyebrow\">Soie sauvage<\u002Fspan>\n            <h3>Nettoyage à sec uniquement<\u002Fh3>\n            <p>Notre soie est traitée à la cire d'abeille — elle craint l'eau. En cas de pluie, laisser sécher à plat avant d'enlever. Pas de repassage direct.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"care-card\">\n            <span class=\"eyebrow\">Laine<\u002Fspan>\n            <h3>Lavage main, eau froide<\u002Fh3>\n            <p>Avec un savon de Marseille doux. Ne pas tordre — presser entre deux serviettes. Sécher à plat. Aérer en saison sèche après chaque port.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"care-card\">\n            <span class=\"eyebrow\">Boutons en corne<\u002Fspan>\n            <h3>Démonter avant lavage machine<\u002Fh3>\n            <p>Ou couvrir d'un filet. Les boutons en corne se polissent à l'huile d'amande douce une fois par an. Ne pas exposer à la chaleur directe.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FAQ -->\n  <section class=\"section section--tight aide-panel\" id=\"panel-faq\">\n    <div class=\"container aide-faq\">\n      <aside class=\"aide-aside\">\n        <h2 class=\"h3\">On nous demande souvent<\u002Fh2>\n        <p>Si votre question n'est pas listée, écrivez-nous — nous répondons en moins d'une journée, parfois en moins d'une heure.<\u002Fp>\n        <a href=\"#\" class=\"btn btn--secondary\">Écrire à l'atelier<\u002Fa>\n      <\u002Faside>\n\n      <div class=\"aide-main\">\n        <div class=\"accordion\">\n          <details open=\"\">\n            <summary><span>Vos pièces taillent-elles grand&nbsp;?<\u002Fspan><span class=\"accordion__icon\">+<\u002Fspan><\u002Fsummary>\n            <div class=\"accordion__body\">\n              <p>Nos coupes sont volontairement amples, dans l'esprit «&nbsp;workwear soigné&nbsp;». Si vous hésitez, prenez votre taille habituelle — vous ne serez jamais à l'étroit, c'est notre engagement.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdetails>\n          <details>\n            <summary><span>D'où viennent vos tissus&nbsp;?<\u002Fspan><span class=\"accordion__icon\">+<\u002Fspan><\u002Fsummary>\n            <div class=\"accordion__body\">\n              <p>Coton et lin du Bénin, du Mali et du Burkina, principalement. Soies sauvages de Côte d'Ivoire et de l'ouest du Cameroun. Laines bouillies importées d'Italie pour les manteaux d'hiver.<\u002Fp>\n              <p>Nous travaillons en direct avec quatre partenaires de longue date. Les noms et adresses sont sur la page «&nbsp;Notre processus&nbsp;».<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdetails>\n          <details>\n            <summary><span>Faites-vous du sur-mesure complet&nbsp;?<\u002Fspan><span class=\"accordion__icon\">+<\u002Fspan><\u002Fsummary>\n            <div class=\"accordion__body\">\n              <p>Oui, sur tous nos modèles. Le sur-mesure ajoute 15 à 25 % au prix et 4 à 6 semaines au délai. Nous prenons vos mesures à l'atelier ou par WhatsApp avec une vidéo guidée.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdetails>\n          <details>\n            <summary><span>Peut-on essayer en boutique&nbsp;?<\u002Fspan><span class=\"accordion__icon\">+<\u002Fspan><\u002Fsummary>\n            <div class=\"accordion__body\">\n              <p>Notre atelier rue Foch est ouvert du mardi au samedi, 10 h – 19 h. C'est aussi notre seul point de vente physique. Tout le catalogue y est disponible à l'essayage.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdetails>\n          <details>\n            <summary><span>Quels moyens de paiement acceptez-vous&nbsp;?<\u002Fspan><span class=\"accordion__icon\">+<\u002Fspan><\u002Fsummary>\n            <div class=\"accordion__body\">\n              <p>Orange Money, MTN Mobile Money, carte bancaire (Visa et Mastercard), virement bancaire, paiement à la livraison pour Douala et Yaoundé. À l'atelier, espèces également.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdetails>\n          <details>\n            <summary><span>Livrez-vous en Europe ou aux USA&nbsp;?<\u002Fspan><span class=\"accordion__icon\">+<\u002Fspan><\u002Fsummary>\n            <div class=\"accordion__body\">\n              <p>Oui, dans le monde entier via DHL Express. 10 à 14 jours, à partir de 34 000 FCFA. Les taxes locales restent à votre charge — nous mentionnons le montant exact lors du calcul.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdetails>\n          <details>\n            <summary><span>Comment fonctionne votre garantie de réparation&nbsp;?<\u002Fspan><span class=\"accordion__icon\">+<\u002Fspan><\u002Fsummary>\n            <div class=\"accordion__body\">\n              <p>Toute pièce achetée chez nous peut nous être renvoyée pour réparation, à n'importe quel moment de sa vie. C'est gratuit pour les défauts de fabrication, et au prix coûtant pour l'usure normale.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdetails>\n          <details>\n            <summary><span>Vos pièces sont-elles fabriquées par qui&nbsp;?<\u002Fspan><span class=\"accordion__icon\">+<\u002Fspan><\u002Fsummary>\n            <div class=\"accordion__body\">\n              <p>Sept couturières et deux apprenties à temps plein, rue Foch à Douala. Toutes salariées, contrat CDI, mutuelle. Nous publions chaque année un rapport d'atelier avec les chiffres et les noms.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdetails>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Contact -->\n  <section class=\"section section--alt section--tight\">\n    <div class=\"container aide-contact\">\n      <header class=\"section-head\" style=\"margin-bottom: 32px;\">\n        <div>\n          <p class=\"eyebrow\">Toujours pas trouvé&nbsp;?<\u002Fp>\n          <h2 class=\"h2\">Écrivez-nous directement.<\u002Fh2>\n        <\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"aide-contact__grid\">\n        <a href=\"#\" class=\"aide-contact__card\">\n          <p class=\"eyebrow\">WhatsApp<\u002Fp>\n          <h3>+237 6 90 12 34 56<\u002Fh3>\n          <p class=\"muted\">Réponse en moins d'une heure, du lundi au samedi de 9 h à 19 h.<\u002Fp>\n        <\u002Fa>\n        <a href=\"#\" class=\"aide-contact__card\">\n          <p class=\"eyebrow\">Email<\u002Fp>\n          <h3>bonjour@celva.cm<\u002Fh3>\n          <p class=\"muted\">Pour les questions plus longues. Réponse sous 24 h.<\u002Fp>\n        <\u002Fa>\n        <a href=\"#\" class=\"aide-contact__card\">\n          <p class=\"eyebrow\">À l'atelier<\u002Fp>\n          <h3>Rue Foch, Douala<\u002Fh3>\n          <p class=\"muted\">Mardi au samedi · 10 h – 19 h. Sans rendez-vous.<\u002Fp>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div data-celva=\"footer\"><\u002Fdiv>\n\n  <style>\n    .aide-head { padding: 56px 0 24px; }\n    .aide-head .eyebrow { color: var(--accent); margin: 0 0 14px; }\n    .aide-head h1 em { color: var(--accent); }\n    .aide-head .lead { max-width: 48ch; }\n\n    .aide-tabs {\n      position: sticky;\n      top: 84px;\n      z-index: 20;\n      background: var(--bg);\n      border-top: 1px solid var(--border);\n      border-bottom: 1px solid var(--border);\n      padding-block: 16px;\n    }\n    .aide-tabs__row {\n      display: flex;\n      gap: 8px;\n      flex-wrap: wrap;\n    }\n    .aide-tab {\n      padding: 10px 16px;\n      border: 1px solid var(--border);\n      background: transparent;\n      color: var(--fg);\n      font-family: var(--font-body);\n      font-weight: 500;\n      font-size: 12px;\n      letter-spacing: 0.14em;\n      text-transform: uppercase;\n      cursor: pointer;\n      transition: all 200ms ease;\n    }\n    .aide-tab:hover { border-color: var(--fg); }\n    .aide-tab.is-active {\n      background: var(--olive);\n      color: var(--cream);\n      border-color: var(--olive);\n    }\n    [data-theme=\"dark\"] .aide-tab.is-active { background: var(--cream); color: var(--dark); border-color: var(--cream); }\n\n    .aide-panel { display: none; }\n    .aide-panel.is-active { display: block; }\n\n    .aide-grid, .aide-faq {\n      display: grid;\n      grid-template-columns: 280px 1fr;\n      gap: 64px;\n      align-items: start;\n    }\n    @media (max-width: 1024px) { .aide-grid, .aide-faq { grid-template-columns: 1fr; gap: 32px; } }\n\n    .aide-aside h2 { margin: 0 0 18px; max-width: 16ch; }\n    .aide-aside p { margin: 0 0 14px; color: var(--fg); }\n    .aide-aside em { color: var(--accent); }\n    .aide-aside .btn { margin-top: 8px; }\n\n    .aide-section-title {\n      margin: 32px 0 16px;\n      padding-bottom: 14px;\n      border-bottom: 1px solid var(--border);\n    }\n    .aide-section-title:first-child { margin-top: 0; }\n\n    /* Size tables */\n    .size-table { overflow-x: auto; margin: 0 0 24px; }\n    .size-table table {\n      width: 100%;\n      border-collapse: collapse;\n      font-family: var(--font-body);\n      font-size: 15px;\n    }\n    .size-table th {\n      text-align: left;\n      padding: 12px 14px;\n      font-family: var(--font-body);\n      font-weight: 500;\n      font-size: 11px;\n      letter-spacing: 0.16em;\n      text-transform: uppercase;\n      color: var(--fg-muted);\n      border-bottom: 1px solid var(--fg);\n    }\n    .size-table td {\n      padding: 14px;\n      border-bottom: 1px solid var(--border);\n    }\n    .size-table tr:hover td { background: var(--bg-alt); }\n    [data-theme=\"dark\"] .size-table tr:hover td { background: var(--dark-surface); }\n    .size-table td:first-child {\n      font-family: var(--font-display);\n      color: var(--accent);\n    }\n\n    .aide-note {\n      display: grid;\n      grid-template-columns: 48px 1fr;\n      gap: 16px;\n      padding: 24px 28px;\n      background: var(--bg-alt);\n      border: 1px solid var(--border);\n      margin-top: 36px;\n      align-items: center;\n    }\n    [data-theme=\"dark\"] .aide-note { background: var(--dark-surface); }\n    .aide-note__num {\n      width: 40px; height: 40px;\n      display: grid;\n      place-items: center;\n      border: 1px solid var(--accent);\n      border-radius: 999px;\n      color: var(--accent);\n      font-family: var(--font-display);\n      font-size: 20px;\n    }\n    .aide-note p { margin: 0; }\n    .aide-note strong { font-family: var(--font-display); font-weight: 400; }\n    .aide-note__link { color: var(--accent); border-bottom: 1px solid var(--accent); padding-bottom: 1px; }\n\n    /* Shipping cards */\n    .ship-list { display: flex; flex-direction: column; }\n    .ship-card {\n      display: grid;\n      grid-template-columns: 220px 1fr auto;\n      gap: 32px;\n      padding: 28px 0;\n      border-bottom: 1px solid var(--border);\n      align-items: center;\n    }\n    .ship-card:first-child { border-top: 1px solid var(--border); }\n    @media (max-width: 720px) {\n      .ship-card { grid-template-columns: 1fr; gap: 8px; }\n    }\n    .ship-card__zone .eyebrow { margin: 0 0 6px; }\n    .ship-card__zone h3 {\n      font-family: var(--font-display);\n      font-weight: 400;\n      font-size: 20px;\n      margin: 0;\n    }\n    .ship-card__detail p:first-child { margin: 0 0 4px; font-family: var(--font-display); font-size: 16px; }\n    .ship-card__detail p:last-child { margin: 0; font-style: italic; font-size: 13px; }\n    .ship-card__price { text-align: right; }\n    @media (max-width: 720px) { .ship-card__price { text-align: left; } }\n    .ship-card__price p {\n      margin: 0;\n      font-family: var(--font-display);\n      font-size: 18px;\n    }\n    .ship-card__price p:last-child { font-size: 12px; font-style: italic; }\n    .ship-card__price .accent { font-style: italic; }\n\n    /* Steps */\n    .aide-steps {\n      list-style: none;\n      padding: 0;\n      margin: 0;\n      counter-reset: a;\n    }\n    .aide-steps li {\n      display: grid;\n      grid-template-columns: 56px 1fr;\n      gap: 24px;\n      padding: 24px 0;\n      border-bottom: 1px solid var(--border);\n    }\n    .aide-steps li:first-child { border-top: 1px solid var(--border); }\n    .aide-steps__num {\n      font-family: var(--font-display);\n      font-size: 14px;\n      letter-spacing: 0.16em;\n      color: var(--accent);\n      padding-top: 4px;\n    }\n    .aide-steps h3 {\n      font-family: var(--font-display);\n      font-weight: 400;\n      font-size: 20px;\n      margin: 0 0 8px;\n    }\n    .aide-steps p { margin: 0; color: var(--fg-muted); max-width: 60ch; }\n\n    /* Care grid */\n    .care-grid {\n      display: grid;\n      grid-template-columns: repeat(2, 1fr);\n      gap: 14px;\n    }\n    @media (max-width: 720px) { .care-grid { grid-template-columns: 1fr; } }\n    .care-card {\n      padding: 24px 26px;\n      border: 1px solid var(--border);\n    }\n    .care-card .eyebrow { color: var(--accent); margin: 0 0 10px; display: block; }\n    .care-card h3 {\n      font-family: var(--font-display);\n      font-weight: 400;\n      font-size: 18px;\n      margin: 0 0 10px;\n    }\n    .care-card p { margin: 0; color: var(--fg-muted); font-size: 14px; line-height: 1.6; }\n\n    /* FAQ accordion (reuse from product) */\n    .accordion details { border-top: 1px solid var(--border); }\n    .accordion details:last-child { border-bottom: 1px solid var(--border); }\n    .accordion summary {\n      list-style: none;\n      cursor: pointer;\n      padding: 22px 0;\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      font-family: var(--font-display);\n      font-size: 17px;\n      color: var(--fg);\n    }\n    .accordion summary::-webkit-details-marker { display: none; }\n    .accordion__icon {\n      font-family: var(--font-body);\n      font-size: 22px;\n      color: var(--accent);\n      transition: transform 200ms ease;\n    }\n    .accordion details[open] .accordion__icon { transform: rotate(45deg); }\n    .accordion__body { padding: 0 0 22px; color: var(--fg-muted); line-height: 1.65; max-width: 60ch; }\n    .accordion__body p { margin: 0 0 10px; }\n    .accordion__body p:last-child { margin: 0; }\n\n    /* Contact */\n    .aide-contact__grid {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 14px;\n    }\n    @media (max-width: 1024px) { .aide-contact__grid { grid-template-columns: 1fr; } }\n    .aide-contact__card {\n      padding: 32px 28px;\n      border: 1px solid var(--border);\n      background: var(--bg);\n      transition: all 200ms ease;\n      display: block;\n      color: inherit;\n    }\n    .aide-contact__card:hover {\n      border-color: var(--accent);\n      transform: translateY(-3px);\n    }\n    .aide-contact__card .eyebrow { color: var(--accent); margin: 0 0 14px; }\n    .aide-contact__card h3 {\n      font-family: var(--font-display);\n      font-weight: 400;\n      font-size: 22px;\n      margin: 0 0 12px;\n    }\n    .aide-contact__card p { margin: 0; }\n  <\u002Fstyle>\n\n  <script src=\"c5790495-e384-4e74-8cdd-412953c87c90\"><\u002Fscript>\n  <script src=\"630acded-2587-4a5d-aa08-2dbbdae2ce66\"><\u002Fscript>\n  <script>\n    document.querySelectorAll('.aide-tab').forEach(tab => {\n      tab.addEventListener('click', () => {\n        const target = tab.dataset.tab;\n        document.querySelectorAll('.aide-tab').forEach(t => t.classList.toggle('is-active', t === tab));\n        document.querySelectorAll('.aide-panel').forEach(p => p.classList.toggle('is-active', p.id === 'panel-' + target));\n        history.replaceState(null, '', '#panel-' + target);\n        window.scrollTo({ top: document.querySelector('.aide-tabs').offsetTop - 50, behavior: 'smooth' });\n      });\n    });\n    // Pick up hash on load\n    if (location.hash && location.hash.startsWith('#panel-')) {\n      const key = location.hash.replace('#panel-', '');\n      const tab = document.querySelector(`.aide-tab[data-tab=\"${key}\"]`);\n      if (tab) tab.click();\n    }\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
