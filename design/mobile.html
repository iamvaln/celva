<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile · Celva</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700&family=Cormorant+Garamond:ital,wght@0,400;0,500&display=swap");
    html, body { margin: 0; padding: 0; height: 100%; background: #1A1A18; color: #FAF7F2; font-family: "Cormorant Garamond", serif; }
    .mobile-hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 100;
      color: rgba(250,247,242,0.78);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .mobile-hud strong {
      display: block;
      font-family: "Bodoni Moda", serif;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 0.18em;
      color: #B26248;
      margin-bottom: 4px;
    }
    /* The iframe should fully cover the iOS device content area */
    .device-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #FAF7F2;
      display: block;
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div class="mobile-hud">
    <strong>Celva · Mobile</strong>
    Glissez pour naviguer · cliquez sur une carte pour la voir en grand
  </div>

  <div id="root"></div>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    function MobileScreen({ src }) {
      return (
        <iframe
          src={src}
          className="device-iframe"
          title={src}
        />
      );
    }

    function MobileCanvas() {
      // Each iPhone is 402×874 (default IOSDevice size).
      // Inside, the iframe loads the actual storefront page at iPhone width.
      const W = 402;
      const H = 874;

      return (
        <DesignCanvas>
          <DCSection id="discovery" title="Découverte" subtitle="L'utilisatrice arrive sur Celva — accueil, exploration, lecture.">
            <DCArtboard id="home" label="01 · Accueil" width={W} height={H}>
              <IOSDevice width={W} height={H}>
                <MobileScreen src="index.html" />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="shop" label="02 · Boutique" width={W} height={H}>
              <IOSDevice width={W} height={H}>
                <MobileScreen src="shop.html" />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="collection" label="03 · Collection — Pluvieuse, douce" width={W} height={H}>
              <IOSDevice width={W} height={H}>
                <MobileScreen src="collection.html" />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="article" label="04 · Journal — Mamadou de Foumban" width={W} height={H}>
              <IOSDevice width={W} height={H}>
                <MobileScreen src="article.html" />
              </IOSDevice>
            </DCArtboard>
          </DCSection>

          <DCSection id="purchase" title="Achat" subtitle="Fiche produit → panier → commande → confirmation.">
            <DCArtboard id="product" label="05 · Fiche produit — Trench Ekiti" width={W} height={H}>
              <IOSDevice width={W} height={H}>
                <MobileScreen src="product.html" />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="cart" label="06 · Panier" width={W} height={H}>
              <IOSDevice width={W} height={H}>
                <MobileScreen src="cart.html" />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="checkout" label="07 · Commande — Livraison" width={W} height={H}>
              <IOSDevice width={W} height={H}>
                <MobileScreen src="checkout.html" />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="confirmation" label="08 · Merci" width={W} height={H}>
              <IOSDevice width={W} height={H}>
                <MobileScreen src="confirmation.html" />
              </IOSDevice>
            </DCArtboard>
          </DCSection>

          <DCSection id="service" title="Service client" subtitle="Compte, aide, authentification, état d'erreur.">
            <DCArtboard id="login" label="09 · Connexion" width={W} height={H}>
              <IOSDevice width={W} height={H}>
                <MobileScreen src="login.html" />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="signup" label="10 · Inscription" width={W} height={H}>
              <IOSDevice width={W} height={H}>
                <MobileScreen src="signup.html" />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="account" label="11 · Mon compte" width={W} height={H}>
              <IOSDevice width={W} height={H}>
                <MobileScreen src="account.html" />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="aide" label="12 · Aide — Guide des tailles" width={W} height={H}>
              <IOSDevice width={W} height={H}>
                <MobileScreen src="aide.html" />
              </IOSDevice>
            </DCArtboard>
            <DCArtboard id="404" label="13 · Page introuvable" width={W} height={H}>
              <IOSDevice width={W} height={H}>
                <MobileScreen src="404.html" />
              </IOSDevice>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MobileCanvas />);
  </script>
</body>
</html>
