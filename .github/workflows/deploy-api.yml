name: Deploy · API

# Same flow as the gabee project (build image → GHCR → SSH `compose up -d` on the
# shared VPS behind Traefik), extended to two environments on one box:
#   push tag v*     → PROD     (api.celva.store,          project `celva`)
#   push develop    → PREPROD  (preprod.api.celva.store,  project `celva-preprod`)
#
# The shared Traefik proxy + `web` network already run on the VPS. Postgres runs
# in each stack; the `migrate` one-shot applies migrations before the API boots.
on:
  push:
    tags: ['v*']
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/iamvaln
  # Opt in to Node 24 for the JS actions below ahead of the Node 20 removal on
  # GitHub Actions runners. Lets us leave action versions pinned.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── Build & push the API image (NestJS + Prisma) ────────────────────────────
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/celva-api
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
      - name: Build & push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # ── Deploy: SSH to the VPS, pull the freshly-pushed image, restart ──────────
  deploy:
    needs: [build-api]
    runs-on: ubuntu-latest
    # Tag → production environment (optional manual-approval gate); develop → preprod.
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'preprod' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # NOTE: don't name this ENV_FILE — the compose file interpolates
          # ${ENV_FILE} for the per-container env_file (value `.env.preprod`,
          # relative to deploy/). A shell ENV_FILE would override the value from
          # --env-file and break that lookup. Use a distinct name for the path.
          envs: IMAGE_TAG,STACK,COMPOSE_ENV_FILE,DEPLOY_REF,GHCR_USER,GHCR_TOKEN,APP_DIR
          script: |
            set -euo pipefail
            cd "${APP_DIR:-$HOME/celva}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG   # shell env overrides IMAGE_TAG in the env file
            git fetch --tags --prune --force origin
            git checkout -f --detach "$DEPLOY_REF"   # exact released commit (tag) or latest origin/develop
            docker compose -p "$STACK" -f deploy/docker-compose.yml --env-file "$COMPOSE_ENV_FILE" pull
            docker compose -p "$STACK" -f deploy/docker-compose.yml --env-file "$COMPOSE_ENV_FILE" up -d
            docker logout ghcr.io
            docker image prune -f
        env:
          IMAGE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'develop' }}
          STACK: ${{ startsWith(github.ref, 'refs/tags/') && 'celva' || 'celva-preprod' }}
          COMPOSE_ENV_FILE: ${{ startsWith(github.ref, 'refs/tags/') && 'deploy/.env.production' || 'deploy/.env.preprod' }}
          DEPLOY_REF: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'origin/develop' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
