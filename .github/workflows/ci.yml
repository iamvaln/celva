name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-flight runs when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # ───────────────────────────────────────────────────────────
  # Static checks — fast, no DB needed.
  # ───────────────────────────────────────────────────────────
  static:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-main-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          # Loosen the EBADENGINE strictness for transitive deps that want
          # Node 20.19+ (eslint-visitor-keys etc).
          NPM_CONFIG_ENGINE_STRICT: 'false'

      - name: Build shared package (consumers typecheck against dist)
        run: npm run build --workspace=@celva/shared

      - name: Lint · Typecheck · Test
        run: npx turbo run lint typecheck test --concurrency=4

  # ───────────────────────────────────────────────────────────
  # API e2e tests — need a real Postgres because Prisma calls
  # $queryRawUnsafe and the auth flow exercises FK cascades.
  # ───────────────────────────────────────────────────────────
  api-e2e:
    name: API · e2e (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celva
          POSTGRES_PASSWORD: celva_ci_password
          POSTGRES_DB: celva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U celva -d celva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://celva:celva_ci_password@localhost:5432/celva?schema=public
      JWT_ACCESS_SECRET: 'ci_access_secret_replace_in_prod_32_chars___'
      JWT_REFRESH_SECRET: 'ci_refresh_secret_replace_in_prod_32_chars__'
      COOKIE_SECRET: 'ci_cookie_secret_replace_in_prod_32_chars___'
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      STOREFRONT_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3002
      CORS_ORIGINS: http://localhost:3000,http://localhost:3002
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          NPM_CONFIG_ENGINE_STRICT: 'false'

      - name: Build @celva/shared
        run: npm run build --workspace=@celva/shared

      - name: Prisma migrate + seed
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: e2e tests
        working-directory: apps/api
        run: npm run test:e2e

  # ───────────────────────────────────────────────────────────
  # Build matrix — verifies each app actually compiles.
  # ───────────────────────────────────────────────────────────
  build:
    name: Build · ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        app: [api, admin, storefront]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-main-
            turbo-${{ runner.os }}-

      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          NPM_CONFIG_ENGINE_STRICT: 'false'

      - name: Build @celva/shared
        run: npm run build --workspace=@celva/shared

      - name: Prisma generate (api)
        if: matrix.app == 'api'
        working-directory: apps/api
        run: npx prisma generate

      - name: Build
        run: npx turbo run build --filter=@celva/${{ matrix.app }}
        env:
          # storefront build needs a base API URL even though we don't hit it.
          API_INTERNAL_URL: http://localhost:3001
          NEXT_PUBLIC_SITE_URL: https://celva.store
          NEXT_PUBLIC_CONTACT_WHATSAPP: '237000000000'
