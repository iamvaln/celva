name: Deploy · Storefront (Vercel)

# Trigger on push to develop (preprod) or main (production).
# Manual trigger also available.
on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/storefront/**'
      - 'packages/shared/**'
      - 'packages/tailwind-config/**'
      - 'packages/typescript-config/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/deploy-storefront.yml'
  workflow_dispatch:

concurrency:
  group: deploy-storefront-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Vercel · ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    runs-on: ubuntu-latest
    if: ${{ vars.STOREFRONT_DEPLOY_ENABLED == 'true' }}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preprod' }}
      url: ${{ github.ref_name == 'main' && 'https://celva.store' || 'https://preprod.celva.store' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_STOREFRONT }}
      VERCEL_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          NPM_CONFIG_ENGINE_STRICT: 'false'

      - name: Build @celva/shared
        run: npm run build --workspace=@celva/shared

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=$VERCEL_ENV --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/storefront

      - name: Build (Vercel)
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi
        working-directory: apps/storefront

      - name: Deploy
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          fi
        working-directory: apps/storefront
